name: update

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api repos/inkle/inky/releases/latest --jq .tag_name)
          current=$(nix eval --raw .#inky.version)
          open=$(gh pr list --state open --head "update-$latest" --json number --jq length)
          if [ "$latest" != "$current" ] && [ "$open" = 0 ]; then
            echo "next=$latest" >> "$GITHUB_OUTPUT"
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          sed -i "s/version = \"$CURRENT\"/version = \"$NEXT\"/" package.nix
          for _ in 1 2; do
            out=$(nix build .#inky --no-link 2>&1) && break
            specified=$(printf '%s\n' "$out" | grep -oE 'specified: +sha256-[A-Za-z0-9+/=]+' | head -1 | awk '{print $2}')
            got=$(printf '%s\n' "$out" | grep -oE 'got: +sha256-[A-Za-z0-9+/=]+' | head -1 | awk '{print $2}')
            if [ -z "$specified" ] || [ -z "$got" ]; then
              printf '%s\n' "$out"
              exit 1
            fi
            sed -i "s|$specified|$got|" package.nix
          done
          nix build .#inky --no-link
      - if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "update-$NEXT"
          git commit -am "update inky to $NEXT"
          git push -u origin "update-$NEXT"
          gh pr create --fill
